name: Build & Push to ECR

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Custom image tag (default: git SHA)"
        required: false

permissions:
  id-token: write   # Required for OIDC auth to AWS
  contents: read

env:
  AWS_REGION:    us-east-1
  ECR_REGISTRY:  ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "IMAGE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials (OIDC — no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ecr
          aws-region:     ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        run: |
          IMAGE="${{ env.ECR_REGISTRY }}/churn/api:${{ env.IMAGE_TAG }}"
          docker build -t $IMAGE ./apps/api
          docker push $IMAGE
          # Also tag as latest on main branch
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            docker tag $IMAGE "${{ env.ECR_REGISTRY }}/churn/api:latest"
            docker push "${{ env.ECR_REGISTRY }}/churn/api:latest"
          fi

      - name: Build and push training image
        run: |
          IMAGE="${{ env.ECR_REGISTRY }}/churn/training:${{ env.IMAGE_TAG }}"
          docker build -t $IMAGE -f ml/Dockerfile.training .
          docker push $IMAGE

      - name: Output image URIs
        run: |
          echo "API Image:      ${{ env.ECR_REGISTRY }}/churn/api:${{ env.IMAGE_TAG }}"
          echo "Training Image: ${{ env.ECR_REGISTRY }}/churn/training:${{ env.IMAGE_TAG }}"
