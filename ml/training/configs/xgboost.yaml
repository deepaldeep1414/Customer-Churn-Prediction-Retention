# XGBoost default hyperparameters (used as starting point before Optuna tuning)
algorithm: xgboost
n_estimators: 300
max_depth: 5
learning_rate: 0.05
subsample: 0.8
colsample_bytree: 0.8
min_child_weight: 3
gamma: 0.1
reg_alpha: 0.1
reg_lambda: 1.0
eval_metric: aucpr
use_label_encoder: false
random_state: 42
