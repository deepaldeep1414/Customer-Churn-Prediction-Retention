version: "3.9"

# ============================================================
# Production Docker Compose
# Differences from dev:
#  - No ports exposed externally (nginx is the only ingress)
#  - Secrets from environment (never .env committed)
#  - Named volumes for persistence
#  - Restart policies: always
#  - Resource limits on all containers
# ============================================================

services:

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./db/migrations/versions:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout:  5s
      retries:  5
    deploy:
      resources:
        limits:
          cpus:   "1.0"
          memory: "2G"
    networks:
      - backend

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    restart: always
    command: >
      mlflow server
        --backend-store-uri postgresql+psycopg2://${MLFLOW_DB_USER}:${MLFLOW_DB_PASSWORD}@postgres:5432/${MLFLOW_DB_NAME}
        --default-artifact-root s3://${MLFLOW_S3_BUCKET}/mlflow-artifacts
        --host 0.0.0.0
        --port 5000
    environment:
      AWS_ACCESS_KEY_ID:     ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION:    ${AWS_DEFAULT_REGION}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus:   "0.5"
          memory: "512M"

  api:
    image: ${ECR_REGISTRY}/churn/api:${MODEL_VERSION:-latest}
    restart: always
    environment:
      DATABASE_URL:          ${DATABASE_URL}
      MLFLOW_TRACKING_URI:   http://mlflow:5000
      SECRET_KEY:            ${SECRET_KEY}
      MODEL_NAME:            ${MODEL_NAME:-churn_predictor}
      RETENTION_CAPACITY:    ${RETENTION_CAPACITY:-200}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      LOG_LEVEL:             ${LOG_LEVEL:-info}
      CORS_ORIGINS:          ${CORS_ORIGINS:-http://superset:8088}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 60s
    networks:
      - backend
    deploy:
      replicas: 2
      resources:
        limits:
          cpus:   "2.0"
          memory: "2G"
      update_config:
        parallelism:   1
        delay:         10s
        failure_action: rollback
      rollback_config:
        parallelism:   1
        delay:         5s

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/ssl:/etc/ssl/churn:ro          # TLS certs (managed externally)
    depends_on:
      - api
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus:   "0.5"
          memory: "256M"

  superset:
    image: apache/superset:3.1.0
    restart: always
    environment:
      SUPERSET_SECRET_KEY:      ${SUPERSET_SECRET_KEY}
      DATABASE_URL:             ${SUPERSET_META_DB}
    volumes:
      - ./apps/dashboard/superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset_data:/app/superset_home
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus:   "1.0"
          memory: "1G"

  training_worker:
    image: ${ECR_REGISTRY}/churn/training:${MODEL_VERSION:-latest}
    restart: "no"            # Only run when explicitly invoked (cron / CI)
    profiles: ["training"]   # Excluded from default compose up
    environment:
      DATABASE_URL:          ${DATABASE_URL}
      MLFLOW_TRACKING_URI:   http://mlflow:5000
      MODEL_NAME:            ${MODEL_NAME:-churn_predictor}
      RETENTION_CAPACITY:    ${RETENTION_CAPACITY:-200}
      AWS_ACCESS_KEY_ID:     ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION:    ${AWS_DEFAULT_REGION}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus:   "4.0"
          memory: "8G"

networks:
  backend:
    driver: bridge

volumes:
  pgdata_prod:
  superset_data:
